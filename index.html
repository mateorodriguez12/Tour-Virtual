<!---------------------------------------------------------------------------------------------------------------------------->
<!-----------------------------------------------VR FICA CIEM 1.1------------------------------------------------------------->
<!---------Modificaciones de la versión: ------------------------------------------------------------------------------------->
<!--------1_ Implementación de efectos de sonido en los Hotspot y signos de interrogación------------------------------------->
<!--------2_ Implementación de audios informativos de ensayo de tracción y charpy, asi también como un audio de bienvenida---->
<!--------3_ Modificacion de Hitbox añadiendo mayor área seleccionable y un resaltado automático------------------------------>
<!---------------------------------------------------------------------------------------------------------------------------->
<!---------------------------------------------------------------------------------------------------------------------------->
<!--Observaciones a corregir: -------------------------------------------------------------------------------------------------
---1_Resaltado de las Hotbox activado la primera vez que se abre el servidor---------------------------------------------------
---2_ Al pasar de Hotspot cargan primero los modelos 3D de "?" antes que la imagen --------------------------------------------
---3_ El audio se corta al salir de la hitbox resaltada, encontrar una solución para que sea menos invasivo para el usuario ---
------------------------------------------------------------------------------------------------------------------------------>

<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <title>Tour Virtual 360 UNSL</title>
    <meta name="description" content="Laboratorio de ciencias de los materiales">

<!-- Componentes de interacción y layout -->
<script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
<script src="https://unpkg.com/aframe-event-set-component@5/dist/aframe-event-set-component.min.js"></script>
<script src="https://unpkg.com/aframe-layout-component@5.3.0/dist/aframe-layout-component.min.js"></script>
<script src="https://unpkg.com/aframe-template-component@3.2.2/dist/aframe-template-component.min.js"></script>
<script src="https://unpkg.com/aframe-proxy-event-component@2.1.0/dist/aframe-proxy-event-component.min.js"></script>
<script src="https://unpkg.com/aframe-look-at-component@0.8.0/dist/aframe-look-at-component.min.js"></script>

<!-- Componente original de cambio de imagen 360 -->
<script src="components/set-image.js"></script>

<script>
  // Componente para controlar qué puntos de información se muestran
  AFRAME.registerComponent('escena-activa', {
    schema: { type: 'string' },
    init: function () {
      var targetGrupo = this.data;
      this.el.addEventListener('click', function () {
        var grupos = document.querySelectorAll('.grupo-info');
        grupos.forEach(function (g) {
          g.setAttribute('visible', false);
          g.setAttribute('scale', '0 0 0');
        });
        var activo = document.querySelector(targetGrupo);
        if (activo) {
          activo.setAttribute('visible', true);
          activo.setAttribute('scale', '1 1 1');
        }
      });
    }
  });

  // Componente para detener los audios al salir del Hitbox transparente
  AFRAME.registerComponent('detener-audio', { 
    init: function () { 
      this.el.addEventListener('mouseleave', () => { 
        for (let nombreComponente in this.el.components) {
          if (nombreComponente.startsWith('sound')) {
            if (nombreComponente !== 'sound__abrir' && nombreComponente !== 'sound__cerrar') {
              this.el.components[nombreComponente].stopSound();
            }
          }
        }
      });
    }
  });

  // Componente para iniciar audio de bienvenida
  AFRAME.registerComponent('reproducir-bienvenida', {
  init: function () {
    let reproducido = false;
    
    // Escucha el evento 'click' directamente desde el raycaster de A-Frame
    this.el.addEventListener('click', () => {
      if (!reproducido) {
        let audio = document.querySelector('#audio-bienvenida');
        if (audio) {
          audio.play();
          reproducido = true;
        }
      }
    });
  }
});
</script>

<!-- APERTURA DE LA ESCENA -->
<a-scene>
      <a-assets>
        <!-- IMÁGENES 360 FALTANTES -->
        <img id="charpy" crossorigin="anonymous" src="img/charpy.jpg">
        <img id="traccion" crossorigin="anonymous" src="img/traccion.jpg">
        <img id="compresion" crossorigin="anonymous" src="img/compresion.jpg">

        <!-- MINIATURAS DEL MENÚ -->
        <img id="charpyM" crossorigin="anonymous" src="img/charpyM.png">
        <img id="traccionM" crossorigin="anonymous" src="img/traccionM.png">
        <img id="compresionM" crossorigin="anonymous" src="img/compresionM.png">

        <!-- MODELOS 3D -->
        <a-asset-item id="interrogacion3d" src="models/interrogacion3d.glb"></a-asset-item>
        <a-asset-item id="maquinacharpy" src="models/Maquina_Charpy.glb"></a-asset-item>
        <a-asset-item id="maquinauniversal" src="models/maquinaUniversal.glb"></a-asset-item>

        <!-- EFECTOS DE SONIDOS -->
        <audio id="audio-transicion" src="sound/Efecto_transicion.MP3" preload="auto"></audio>
        <audio id="audio-abrir" src="sound/open_info.MP3" preload="auto"></audio>
        <audio id="audio-cerrar" src="sound/close_info.MP3" preload="auto"></audio>

        <!-- AUDIOS DE ENSAYOS Y DEMÁS -->
        <audio id="audio-bienvenida" src="audio/bienvenida.mp3" preload="auto"></audio>
        <audio id="audio-charpy" src="audio/charpy.MP3" preload="auto"></audio>
        <audio id="audio-traccion" src="audio/traccion.MP3" preload="auto"></audio>

        <!-- Plantilla reutilizable para los botones del menú inferior con texto -->
        <script id="link" type="text/html">
          <a-entity class="link"
            geometry="primitive: plane; height: 1; width: 1"
            material="shader: flat; src: ${thumb}"
            event-set__1="_event: mousedown; scale: 1 1 1"
            event-set__2="_event: mouseup; scale: 1.2 1.2 1"
            event-set__3="_event: mouseenter; scale: 1.2 1.2 1"
            event-set__4="_event: mouseleave; scale: 1 1 1"
            set-image="on: click; target: #image-360; src: ${src}"
            sound="src: #audio-transicion; on: click; poolSize: 3; volume: 0.8">
            
            <a-text 
              value="${title}" 
              align="center" 
              position="0 -0.75 0.05" 
              width="2.8" 
              color="#FFFFFF">
            </a-text>
          </a-entity>
        </script>
      </a-assets>

      <!-- FONDO 360 INICIAL -->
      <a-sky id="image-360" radius="10" src="#charpy"></a-sky>

      <!-- TÍTULO DEL RECORRIDO -->
      <a-text position="-2.5 1.5 -4"
              anchor="left"
              width="6"
              color="white"
              id="img-text"
              value="Laboratorio de Ciencias de los Materiales"></a-text>
      
      <!-- MENÚ DE 3 BOTONES -->
      <a-entity id="links" layout="type: line; margin: 1.5" position="-1.5 0 -4">
        <a-entity template="src: #link" data-src="#charpy" data-thumb="#charpyM" data-title="Ensayo de choque" escena-activa="#info-charpy-group"></a-entity>
        <a-entity template="src: #link" data-src="#traccion" data-thumb="#traccionM" data-title="Ensayo de traccion" escena-activa="#info-traccion-group"></a-entity>
        <a-entity template="src: #link" data-src="#compresion" data-thumb="#compresionM" data-title="Ensayo de compresion" escena-activa="#info-compresion-group"></a-entity>
      </a-entity>


      <!-- ============================================================== -->
      <!-- PUNTOS DE INFORMACIÓN POR ZONA                      -->
      <!-- ============================================================== -->

      <!-- 1. ZONA CHARPY  -->
      <a-entity id="info-charpy-group" class="grupo-info" visible="true" scale="1 1 1">


        <!-- Hotspot 1: microscopio -->
        <a-entity position="-4.5 -3.5 -3"> 
          
          <!-- HITBOX RECTANGULAR TRANSPARENTE -->
          <a-box 
            class="link"
            width="1.2" height="1.6" depth="1.2"
            scale="0.2 0.2 0.2"
            material="opacity: 0; transparent: true"
            event-set__show="_event: mouseenter; _target: #card-charpy1; visible: true"
            event-set__hide="_event: mouseleave; _target: #card-charpy1; visible: false"
            sound__abrir="src: #audio-abrir; on: mouseenter; poolSize: 3; volume: 0.6"
            sound__cerrar="src: #audio-cerrar; on: mouseleave; poolSize: 3; volume: 0.6">
          </a-box>

          <!-- Modelo 3D rotando en su eje Y -->
          <a-gltf-model 
            src="#interrogacion3d" 
            scale="0.2 0.2 0.2"
            rotation="90 -90 -90"
            animation="property: rotation; from: 90 -90 -90; to: 90 270 -90; loop: true; dur: 4000; easing: linear">
          </a-gltf-model>
          
          <!-- Cartel explicativo -->
          <a-entity id="card-charpy1" position="0 0.8 0" visible="false" look-at="[camera]">
            <a-plane width="2.6" height="1.1" color="#111111" material="opacity: 0.85; transparent: true" geometry="" position="0 0.26109 0.13034"></a-plane>
            <a-text value="Microscopio metalográfico" align="center" position="0 0.57391 0.15674" width="2.8" color="#00D2FF" text=""></a-text>
            <a-text value="Permite observar la estructura de los metales." align="center" position="0 0.15006 0.14484" width="2.4" color="#FFFFFF" wrap-count="28" text=""></a-text>
          </a-entity>
        </a-entity>



        <!-- Hotspot 2: durometro -->
        <a-entity position="-8 0.5 1"> 
          
          <!-- HITBOX RECTANGULAR TRANSPARENTE -->
          <a-box 
            class="link"
            width="1.2" height="1.6" depth="1.2"
            scale="0.4 0.4 0.4"
            material="opacity: 0; transparent: true"
            event-set__show="_event: mouseenter; _target: #card-charpy2; visible: true"
            event-set__hide="_event: mouseleave; _target: #card-charpy2; visible: false"
            sound__abrir="src: #audio-abrir; on: mouseenter; poolSize: 3; volume: 0.6"
            sound__cerrar="src: #audio-cerrar; on: mouseleave; poolSize: 3; volume: 0.6">
          </a-box>

          <!-- Modelo 3D rotando en su eje Y -->
          <a-gltf-model 
            src="#interrogacion3d" 
            scale="0.3 0.3 0.3"
            rotation="90 -90 -90"
            animation="property: rotation; from: 90 -90 -90; to: 90 270 -90; loop: true; dur: 4000; easing: linear">
          </a-gltf-model>
          
          <!-- Cartel explicativo -->
          <a-entity id="card-charpy2" position="0 0.8 0" visible="false" look-at="[camera]">
            <a-plane width="3" height="1.1" color="#111111" material="opacity: 0.85; transparent: true" geometry="" position="0 0.37793 -0.06094"></a-plane>
            <a-text value="Durometro" align="center" position="0 0.61035 -0.03004" width="3.2" color="#00D2FF" text=""></a-text>
            <a-text value="Determina la dureza del material." align="center" position="0 0.22944 -0.03312" width="2.4" color="#FFFFFF" wrap-count="28" text=""></a-text>
          </a-entity>
        </a-entity>


        <!-- Hotspot 3: Péndulo de Charpy -->
        <a-entity position="2.6 -0.6 -0.8">
          
          <!-- HITBOX RECTANGULAR TRANSPARENTE -->
          <a-box 
            class="link"
            width="1.2" height="1.6" depth="1.2"
            scale="0.2 4.764 4.40114"
            material="opacity: 0.3; transparent: true"
            event-set__show="_event: mouseenter; _target: #card-charpy3; visible: true"
            event-set__hide="_event: mouseleave; _target: #card-charpy3; visible: false"
            event-set__coloron="_event: mouseenter; material.opacity: 0.3"
            event-set__coloroff="_event: mouseleave; material.opacity: 0"
            sound__abrir="src: sound/open_info.MP3; on: mouseenter; poolSize: 3; volume: 0.6"
            sound__cerrar="src: sound/close_info.MP3; on: mouseleave; poolSize: 3; volume: 0.6"
            sound__charpy="src: audio/charpy.MP3; on: mouseenter; volume: 0.6"
            detener-audio=""
            geometry=""
            position="3.20032 -2.141 0.073"
            rotation="0 -2.2225032873124633 0">
          </a-box>

          <!-- Modelo 3D rotando en su eje Y -->
          <a-gltf-model 
            src="#interrogacion3d"
            scale="0.2 0.2 0.2"
            rotation="90 -18.54899999946355 -90"
            animation="property: rotation; from: 90 -90 -90; to: 90 270 -90; loop: true; dur: 4000; easing: linear"
            gltf-model="models/interrogacion3d.glb"
            position="2.55493 -3.6713 -0.00017">
          </a-gltf-model>
          
          <!-- Cartel explicativo -->
          <a-entity id="card-charpy3" position="0 0.8 0" visible="false" look-at="[camera]">
            <a-plane width="2.6" height="1.1" color="#111111" material="opacity: 0.85; transparent: true" geometry="" position="-0.84545 -0.01907 -0.25944"></a-plane>
            <a-text value="Pendulo Charpy" align="center" position="-0.76711 0.28269 -0.2154" width="2.8" color="#00D2FF" text=""></a-text>
            <a-text value="Determina la tenacidad y energia absorbida por impacto." align="center" position="-0.82869 -0.1187 -0.2343" width="2.4" color="#FFFFFF" wrap-count="28" text=""></a-text>
          </a-entity>
        </a-entity>
      </a-entity>

      <!----------------------------------------------------------------------------------------------------------------------------------------------------------------------------->
      <!----------------------------------------------------------------------------------------------------------------------------------------------------------------------------->

      <!-- 2. ZONA TRACCIÓN -->
      <a-entity id="info-traccion-group" class="grupo-info" visible="false" scale="0 0 0">
        <!-- Hotspot 1: Máquina Universal de Tracción -->
        <a-entity position="-3.6 0.8 0.7">
          
          <!-- HITBOX RECTANGULAR TRANSPARENTE -->
          <a-box 
            class="link"
            width="1.2" height="1.6" depth="1.2"
            scale="4.82628 5.68633 3.236"
            material="opacity: 0.3; transparent: true"
            event-set__show="_event: mouseenter; _target: #card-traccion; visible: true"
            event-set__hide="_event: mouseleave; _target: #card-traccion; visible: false"
            event-set__coloron="_event: mouseenter; material.opacity: 0.3"
            event-set__coloroff="_event: mouseleave; material.opacity: 0"
            sound__abrir="src: sound/open_info.MP3; on: mouseenter; poolSize: 3; volume: 0.6"
            sound__cerrar="src: sound/close_info.MP3; on: mouseleave; poolSize: 3; volume: 0.6"
            sound__traccion="src: audio/traccion.MP3; on: mouseenter; volume: 0.6"
            detener-audio=""
            geometry=""
            position="-0.88067 -1.71817 2.21069"
            rotation="-2.062075104675833 -53.231216914424266 1.4140598383828717">
          </a-box>

          <!-- Modelo 3D ? -->
          <a-gltf-model 
            src="#interrogacion3d"
            scale="0.2 0.2 0.2"
            rotation="90 78.54300000026824 -90"
            animation="property: rotation; from: 90 -90 -90; to: 90 270 -90; loop: true; dur: 4000; easing: linear"
            gltf-model="models/interrogacion3d.glb"
            position="1.237 -1.99462 -0.294">
          </a-gltf-model>
          
          <!-- Cartel explicativo -->
          <a-entity id="card-traccion" position="0.92954 -0.46698 -0.22674" visible="" look-at="[camera]" background="" anchored="">
            <a-plane width="2.6" height="1.1" color="#111111" material="opacity: 0.85; transparent: true" geometry="" position="0.47805 0.03717 0.0852"></a-plane>
            <a-text value="Maquina Universal de Ensayos" align="center" position="0.51329 0.33991 0.11148" width="2.8" color="#00D2FF" text=""></a-text>
            <a-text value="Mide limite elastico, resistencia a la traccion y alargamiento." align="center" position="0.4979 -0.06129 0.10874" width="2.4" color="#FFFFFF" wrap-count="28" text=""></a-text>
          </a-entity>
        </a-entity>
      </a-entity>
      

      <!----------------------------------------------------------------------------------------------------------------------------------------------------------------------------->
      <!----------------------------------------------------------------------------------------------------------------------------------------------------------------------------->

      <!-- 3. ZONA COMPRESIÓN  -->
      <a-entity id="info-compresion-group" class="grupo-info" visible="false" scale="0 0 0">
        
        <!-- Hotspot 1: Prensa de compresión -->
        <a-entity position="2.5 0.5 -1"> 
          
          <!-- HITBOX RECTANGULAR TRANSPARENTE -->
          <a-box 
            class="link"
            width="1.2" height="1.6" depth="1.2"
            scale="0.2 0.2 0.2"
            material="opacity: 0; transparent: true"
            event-set__show="_event: mouseenter; _target: #card-comp1; visible: true"
            event-set__hide="_event: mouseleave; _target: #card-comp1; visible: false"
            sound__abrir="src: #audio-abrir; on: mouseenter; poolSize: 3; volume: 0.6"
            sound__cerrar="src: #audio-cerrar; on: mouseleave; poolSize: 3; volume: 0.6">
          </a-box>

          <!-- Modelo 3D rotando en su eje Y -->
          <a-gltf-model 
            src="#interrogacion3d" 
            scale="0.2 0.2 0.2"
            rotation="90 -90 -90"
            animation="property: rotation; from: 90 -90 -90; to: 90 270 -90; loop: true; dur: 4000; easing: linear">
          </a-gltf-model>
          
          <!-- Cartel explicativo -->
          <a-entity id="card-comp1" position="0 0.8 0" visible="false" look-at="[camera]">
            <a-plane width="2.6" height="1.1" color="#111111" material="opacity: 0.85; transparent: true"></a-plane>
            <a-text value="Prensa de Compresion" align="center" position="0 0.3 0.02" width="2.8" color="#00D2FF"></a-text>
            <a-text value="Aplica cargas axiales para evaluar resistencia al aplastamiento." align="center" position="0 -0.1 0.02" width="2.4" color="#FFFFFF" wrap-count="28"></a-text>
          </a-entity>
        </a-entity>

        <!-- Hotspot 2: Área de control / Probetas de compresión -->
        <a-entity position="-2 0 4">
          
          <!-- HITBOX RECTANGULAR TRANSPARENTE -->
          <a-box 
            class="link"
            width="1.2" height="1.6" depth="1.2"
            scale="0.2 0.2 0.2"
            material="opacity: 0; transparent: true"
            event-set__show="_event: mouseenter; _target: #card-comp2; visible: true"
            event-set__hide="_event: mouseleave; _target: #card-comp2; visible: false"
            sound__abrir="src: #audio-abrir; on: mouseenter; poolSize: 3; volume: 0.6"
            sound__cerrar="src: #audio-cerrar; on: mouseleave; poolSize: 3; volume: 0.6">
          </a-box>

          <!-- Modelo 3D rotando en su eje Y -->
          <a-gltf-model 
            src="#interrogacion3d" 
            scale="0.2 0.2 0.2"
            rotation="90 -90 -90"
            animation="property: rotation; from: 90 -90 -90; to: 90 270 -90; loop: true; dur: 4000; easing: linear">
          </a-gltf-model>
          
          <!-- Cartel explicativo -->
          <a-entity id="card-comp2" position="0 0.8 0" visible="false" look-at="[camera]">
            <a-plane width="2.6" height="1.1" color="#111111" material="opacity: 0.85; transparent: true"></a-plane>
            <a-text value="Banco de Probetas" align="center" position="0 0.3 0.02" width="2.8" color="#00D2FF"></a-text>
            <a-text value="Muestras preparadas bajo normas para ensayos destructivos." align="center" position="0 -0.1 0.02" width="2.4" color="#FFFFFF" wrap-count="28"></a-text>
          </a-entity>
        </a-entity>

      </a-entity>


      <!-- CÁMARA CON CURSOR INTERACTIVO -->
      <a-entity camera look-controls>
        <a-cursor id="cursor"
          reproducir-bienvenida
          animation__click="property: scale; startEvents: click; from: 0.1 0.1 0.1; to: 1 1 1; dur: 150"
          animation__fusing="property: fusing; startEvents: fusing; from: 1 1 1; to: 0.1 0.1 0.1; dur: 1500"
          event-set__1="_event: mouseenter; color: springgreen"
          event-set__2="_event: mouseleave; color: black"
          fuse="true"
          raycaster="objects: .link">
        </a-cursor>
      </a-entity>

      <!-- PUNTERO LÁSER PARA MANDOS -->
      <a-entity laser-controls="hand: left" raycaster="objects: .link; far: 15"></a-entity>
      <a-entity laser-controls="hand: right" raycaster="objects: .link; far: 15"></a-entity>
      
    </a-scene>
  </body>
</html>
